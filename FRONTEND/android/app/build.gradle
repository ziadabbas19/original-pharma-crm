apply plugin: 'com.android.application'

// Release signing comes from the environment or from the git-ignored android/keystore.properties.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String variable, String property ->
    System.getenv(variable) ?: keystoreProperties.getProperty(property)
}
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')

// Known spoofing apps and root tools live in one file, known-location-spoofing-apps.xml. It is merged
// into the manifest as a <queries> block (so the app may look up exactly these packages) and its
// package names become BuildConfig.KNOWN_SPOOFING_APPS / KNOWN_ROOT_APPS for DeviceSignalsPlugin.
def knownAppsFile = file('known-location-spoofing-apps.xml')
def knownApps = [spoofing: [], root: []]
def knownAppsSection = null
knownAppsFile.eachLine { line ->
    def section = line =~ /<!--\s*section:\s*(\w+)\s*-->/
    if (section.find()) {
        knownAppsSection = section.group(1)
        return
    }
    def pkg = line =~ /<package\s+android:name="([^"]+)"/
    if (pkg.find() && knownApps.containsKey(knownAppsSection)) {
        knownApps[knownAppsSection] << pkg.group(1)
    }
}
def javaStringArray = { List names -> '{' + names.collect { "\"${it}\"" }.join(', ') + '}' }

android {
    namespace = "com.originalpharma.crm"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    sourceSets {
        // Build-type manifests are merged on top of src/main/AndroidManifest.xml.
        debug.manifest.srcFile knownAppsFile
        release.manifest.srcFile knownAppsFile
    }
    defaultConfig {
        applicationId "com.originalpharma.crm"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.8"
        buildConfigField "String[]", "KNOWN_SPOOFING_APPS", javaStringArray(knownApps.spoofing)
        buildConfigField "String[]", "KNOWN_ROOT_APPS", javaStringArray(knownApps.root)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds may talk to a local plain-http API (emulator: http://10.0.2.2:5080).
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            signingConfig = releaseStoreFile ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// CAP_DEV_HTTP is written into the synced Capacitor config; a release must never ship with it.
tasks.register('verifyReleaseConfig') {
    def syncedConfig = file('src/main/assets/capacitor.config.json')
    def signed = releaseStoreFile != null
    doLast {
        if (!signed) {
            throw new GradleException('Release signing is not configured. See "Android" in docs/deployment.md.')
        }
        if (!syncedConfig.exists()) {
            throw new GradleException('Run "npx cap sync android" before building a release.')
        }
        def config = new groovy.json.JsonSlurper().parse(syncedConfig)
        if (config.server?.cleartext == true || config.android?.allowMixedContent == true || config.server?.url) {
            throw new GradleException('This sync allows plain HTTP. Run "npx cap sync android" again without CAP_DEV_HTTP.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseConfig' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
